[workspace]
resolver = "2"
members = [
    "crates/ember-core",
    "crates/ember-syntax",
    "crates/ember-config",
    "crates/ember-ui",
    "crates/ember-lsp",
    "crates/ember-plugins",
    "crates/ember-app",
]

[workspace.dependencies]
ropey = "1.6"
anyhow = "1.0"
thiserror = "1.0"
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"
notify = "6.1"
tokio = { version = "1", features = ["full"] }
eframe = "0.29"
egui = "0.29"
tree-sitter = "0.24"
parking_lot = "0.12"
log = "0.4"
env_logger = "0.11"